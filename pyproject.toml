[project]
name = "video-autogen"
version = "0.1.0"
description = "Sistema self-hosted para generar Reels verticales narrativos (estilo lana/crochet + i2v) con GPU local"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Jose" }]

# Dependencias del NÚCLEO (orquestación, datos, análisis del video de referencia).
# Las dependencias pesadas de ML (torch, ComfyUI, TTS, whisper) se instalan aparte
# en su propio entorno/script — ver scripts/setup_models.ps1.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Análisis del video de referencia (Paso 0)
    "numpy>=1.26",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
]
ui = [
    "gradio>=4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[project.scripts]
vautogen = "core.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
